<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#5b6cff">
<title>屿航 · 屿事</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%235b6cff'/%3E%3Cstop offset='1' stop-color='%239a5bff'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect x='3' y='3' width='58' height='58' rx='16' fill='url(%23g)'/%3E%3Cpath fill='%23fff' d='M32 15l4.4 13-4.4-2.3-4.4 2.3z'/%3E%3Cpath fill='%23fff' d='M12 46a20 20 0 0 1 40 0z'/%3E%3C/svg%3E">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="ip/ip.css">
<style>

* { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body {
  font-family: var(--font);
  color: var(--text);
  font-size: 14px;
  min-height: 100vh;
  background:
    radial-gradient(1200px 700px at 15% -10%, color-mix(in oklab, var(--accent) 18%, transparent), transparent 60%),
    radial-gradient(900px 600px at 110% 10%, color-mix(in oklab, var(--accent-2) 16%, transparent), transparent 60%),
    radial-gradient(700px 500px at 50% 110%, color-mix(in oklab, var(--accent) 12%, transparent), transparent 60%),
    var(--bg);
  position: relative;
  overflow-x: hidden;
}
body::before {
  content: "";
  position: fixed;
  inset: 0;
  pointer-events: none;
  opacity: .35;
  background-image:
    radial-gradient(rgba(91,108,255,.10) 1px, transparent 1px),
    radial-gradient(rgba(139,92,246,.08) 1px, transparent 1px);
  background-size: 42px 42px, 63px 63px;
  background-position: 0 0, 21px 21px;
  mask-image: radial-gradient(ellipse at 50% 0%, #000 40%, transparent 80%);
  -webkit-mask-image: radial-gradient(ellipse at 50% 0%, #000 40%, transparent 80%);
  z-index: 0;
}
/* 页面浮动光斑 */
.bg-blob {
  position: fixed;
  border-radius: 50%;
  filter: blur(70px);
  opacity: .28;
  pointer-events: none;
  z-index: 0;
  animation: blobFloat 22s ease-in-out infinite;
}
.bg-blob-1 { width: 480px; height: 480px; background: var(--accent); top: -160px; left: -160px; }
.bg-blob-2 { width: 420px; height: 420px; background: var(--accent-2); bottom: -140px; right: -140px; animation-delay: -8s; }
.bg-blob-3 { width: 320px; height: 320px; background: color-mix(in oklab, var(--accent) 50%, var(--accent-2)); top: 40%; left: 60%; animation-delay: -14s; opacity: .18; }
@media (prefers-color-scheme: dark) {
  .bg-blob { opacity: .18; }
  .bg-blob-3 { opacity: .12; }
}
@keyframes blobFloat {
  0%, 100% { transform: translate(0, 0) scale(1); }
  33% { transform: translate(30px, -24px) scale(1.05); }
  66% { transform: translate(-24px, 24px) scale(.95); }
}

/* ---- 顶栏 ---- */
.topbar {
  display: flex; align-items: center; justify-content: space-between;
  padding: 14px 24px;
  background: color-mix(in oklab, var(--panel) 82%, transparent);
  border-bottom: 1px solid var(--border);
  position: sticky; top: 0; z-index: 10;
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  box-shadow: var(--shadow);
}
.brand {
  font-size: 18px; font-weight: 800;
  display: flex; align-items: center; gap: 10px;
  background: linear-gradient(135deg, var(--accent), var(--accent-2));
  -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
}
.brand svg { width: 26px; height: 26px; }
.brand .sub { font-size: 12px; font-weight: 600; color: var(--faint); -webkit-text-fill-color: var(--faint); margin-left: 4px; }
.topbar-back {
  font-size: 13px; color: var(--text-2);
  text-decoration: none; padding: 7px 14px; border-radius: 8px;
  border: 1px solid var(--border); background: var(--panel-2);
  transition: all .2s;
}
.topbar-back:hover,
.topbar-back:focus-visible { color: var(--accent); border-color: var(--accent); }
.topbar-back:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.page-links { display: flex; align-items: center; gap: 8px; }
.page-links a {
  font-size: 13px; color: var(--text-2); text-decoration: none;
  padding: 7px 11px; border-radius: 8px;
  border: 1px solid var(--border); background: var(--panel-2);
  transition: all .2s;
}
.page-links a:hover, .page-links a:focus-visible { color: var(--accent); border-color: var(--accent); }
.page-links a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* ---- 主容器 ---- */
.container {
  max-width: 840px;
  margin: 0 auto;
  padding: 26px 20px 60px;
  position: relative;
  z-index: 1;
}

/* ---- 欢迎横幅 ---- */
.welcome-bar {
  display: flex; align-items: center; gap: 12px;
  padding: 12px 18px;
  margin-bottom: 18px;
  background: linear-gradient(135deg, color-mix(in oklab, var(--accent) 12%, transparent), color-mix(in oklab, var(--accent-2) 10%, transparent));
  border: 1px solid var(--border-soft);
  border-radius: var(--radius);
  font-size: 13.5px;
  color: var(--text-2);
  animation: slideInTop .5s ease both;
}
.welcome-bar strong { color: var(--text); font-weight: 700; }
.welcome-bar .w-mascot { width: 32px; flex-shrink: 0; }
.welcome-bar .w-tip { color: var(--faint); font-size: 12px; margin-left: auto; }
@keyframes slideInTop {
  from { opacity: 0; transform: translateY(-8px); }
  to { opacity: 1; transform: translateY(0); }
}

/* ---- 统计卡 ---- */
.stats-row {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 12px;
  margin-bottom: 20px;
}
.stat-card {
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 14px 12px 12px;
  box-shadow: var(--shadow);
  text-align: center;
  position: relative;
  overflow: hidden;
  transition: transform .18s ease, box-shadow .18s ease;
  animation: cardPop .5s cubic-bezier(0.34,1.56,0.64,1) both;
}
.stat-card:nth-child(1){animation-delay:0ms}
.stat-card:nth-child(2){animation-delay:80ms}
.stat-card:nth-child(3){animation-delay:160ms}
.stat-card:nth-child(4){animation-delay:240ms}
@keyframes cardPop {
  from { opacity: 0; transform: translateY(12px) scale(.96); }
  to { opacity: 1; transform: translateY(0) scale(1); }
}
.stat-card:hover { transform: translateY(-3px); box-shadow: var(--shadow-lift); }
.stat-card::after {
  content: "";
  position: absolute;
  left: 0; right: 0; bottom: 0;
  height: 3px;
  background: linear-gradient(90deg, var(--accent), var(--accent-2));
  opacity: 0;
  transition: opacity .25s ease;
}
.stat-card:hover::after { opacity: 1; }
.stat-card[data-stat="high"]::after { background: linear-gradient(90deg, #ef4444, #f59e0b); }
.stat-card[data-stat="done"]::after { background: linear-gradient(90deg, #16a34a, #22c55e); }
.stat-card .stat-ico { font-size: 16px; line-height: 1; margin-bottom: 6px; display: block; }
.stat-num {
  font-size: 30px; font-weight: 800; line-height: 1;
  font-variant-numeric: tabular-nums;
  background: linear-gradient(135deg, var(--accent), var(--accent-2));
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  background-clip: text;
  transition: transform .25s ease;
}
.stat-card .stat-num.chimp {
  animation: statChimp .4s ease;
}
@keyframes statChimp {
  0% { transform: scale(1); }
  40% { transform: scale(1.22); }
  100% { transform: scale(1); }
}
.stat-card[data-stat="high"] .stat-num { background: linear-gradient(135deg, #ef4444, #f59e0b); -webkit-background-clip:text; background-clip:text; }
.stat-card[data-stat="done"] .stat-num { background: linear-gradient(135deg, #16a34a, #22c55e); -webkit-background-clip:text; background-clip:text; }
.stat-label {
  font-size: 11px; font-weight: 700; color: var(--faint);
  margin-top: 6px; letter-spacing: .5px;
}

/* ---- 进度条 ---- */
.progress-bar {
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 14px 18px 14px 22px;
  margin-bottom: 20px;
  box-shadow: var(--shadow);
  display: flex; align-items: center; gap: 14px;
  position: relative;
}
.progress-bar::before {
  content: ""; position: absolute; left: 12px; top: 50%; transform: translateY(-50%);
  width: 4px; height: 26px; border-radius: 2px;
  background: linear-gradient(var(--accent), var(--accent-2));
}
.progress-info { flex: 0 0 auto; display: flex; flex-direction: column; gap: 2px; padding-left: 8px; min-width: 132px; }
.progress-label { font-size: 11px; color: var(--faint); font-weight: 600; }
.progress-text {
  font-size: 18px; font-weight: 800;
  background: linear-gradient(135deg, var(--accent), var(--accent-2));
  -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
  font-variant-numeric: tabular-nums;
}
.progress-track {
  flex: 1; height: 10px; border-radius: 5px;
  background: var(--border-soft);
  overflow: hidden;
  box-shadow: inset 0 1px 2px rgba(20,30,60,.10);
}
.progress-fill {
  height: 100%; border-radius: 5px;
  background: linear-gradient(90deg, var(--accent), var(--accent-2));
  transition: width .7s cubic-bezier(0.34,1.56,0.64,1);
  width: 0%;
  box-shadow: 0 0 14px color-mix(in oklab, var(--accent) 50%, transparent);
  position: relative;
}
.progress-fill::after {
  content: "";
  position: absolute;
  inset: 0;
  background: linear-gradient(90deg, transparent 0%, rgba(255,255,255,.4) 50%, transparent 100%);
  animation: progressShine 2.6s ease-in-out infinite;
}
@keyframes progressShine {
  0% { transform: translateX(-100%); }
  100% { transform: translateX(100%); }
}
.progress-emoji {
  font-size: 18px;
  width: 26px;
  text-align: center;
  flex-shrink: 0;
  transition: transform .3s ease;
}
.progress-emoji.boom { animation: emojiBoom .5s ease; }
@keyframes emojiBoom {
  0% { transform: scale(1) rotate(0deg); }
  30% { transform: scale(1.4) rotate(-14deg); }
  70% { transform: scale(1.3) rotate(14deg); }
  100% { transform: scale(1) rotate(0deg); }
}

/* ---- 添加表单 ---- */
.add-form {
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 16px 18px;
  margin-bottom: 18px;
  box-shadow: var(--shadow);
  transition: box-shadow .25s ease, border-color .25s ease;
}
.add-form.shake { animation: formShake .35s ease; }
@keyframes formShake {
  0%, 100% { transform: translateX(0); }
  20% { transform: translateX(-6px); }
  40% { transform: translateX(6px); }
  60% { transform: translateX(-4px); }
  80% { transform: translateX(4px); }
}
.add-form.success-pulse {
  border-color: var(--green);
  box-shadow: 0 0 0 3px color-mix(in oklab, var(--green) 22%, transparent), var(--shadow);
}
.add-form-row {
  display: flex; gap: 8px; margin-bottom: 10px;
}
.add-form-row:last-child { margin-bottom: 0; }
.add-form input[type="text"],
.add-form select {
  flex: 1; padding: 11px 14px; border-radius: var(--radius-sm);
  border: 1px solid var(--border); background: var(--panel-2);
  color: var(--text); font-size: 13.5px; font-family: inherit;
  outline: none; transition: border-color .2s, box-shadow .2s, background .2s;
}
.add-form input[type="text"]:focus,
.add-form select:focus,
.add-form input[type="text"]:focus-visible,
.add-form select:focus-visible {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px var(--accent-soft);
  background: var(--panel);
}
.add-btn {
  padding: 11px 22px; border-radius: var(--radius-sm); border: none;
  background: linear-gradient(135deg, var(--accent), var(--accent-2));
  color: #fff; font-size: 13.5px; font-weight: 700; font-family: inherit;
  cursor: pointer; white-space: nowrap;
  box-shadow: 0 4px 12px color-mix(in oklab, var(--accent) 35%, transparent);
  transition: opacity .2s, transform .15s ease, box-shadow .2s;
  position: relative;
  overflow: hidden;
}
.add-btn:hover { opacity: .94; box-shadow: 0 6px 16px color-mix(in oklab, var(--accent) 40%, transparent); }
.add-btn:active { transform: scale(.97); }
.add-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.add-btn .btn-shine {
  position: absolute;
  top: 0; left: -100%;
  width: 60%;
  height: 100%;
  background: linear-gradient(90deg, transparent, rgba(255,255,255,.35), transparent);
  pointer-events: none;
}
.add-btn.flash .btn-shine {
  animation: btnShine .6s ease;
}
@keyframes btnShine {
  from { left: -100%; }
  to { left: 120%; }
}
.add-success {
  font-size: 12px;
  color: var(--green);
  font-weight: 700;
  margin-top: 6px;
  opacity: 0;
  transform: translateY(4px);
  transition: opacity .2s, transform .2s;
  height: 0;
  overflow: hidden;
}
.add-success.show {
  opacity: 1;
  transform: translateY(0);
  height: auto;
  margin-bottom: 4px;
}

/* ---- 筛选栏 ---- */
.filter-bar {
  display: flex; align-items: center; gap: 6px;
  margin-bottom: 16px; flex-wrap: wrap;
  padding: 10px 12px;
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
}
.filter-btn {
  padding: 6px 13px; border-radius: 999px;
  border: 1px solid var(--border); background: var(--panel-2);
  color: var(--text-2); font-size: 12px; font-weight: 600; font-family: inherit;
  cursor: pointer; transition: all .18s ease;
  position: relative;
}
.filter-btn:hover { border-color: var(--accent); color: var(--accent); }
.filter-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.filter-btn.active {
  background: linear-gradient(135deg, var(--accent), var(--accent-2));
  color: #fff; border-color: transparent;
  box-shadow: 0 3px 10px color-mix(in oklab, var(--accent) 30%, transparent);
  transform: scale(1.04);
}
.filter-btn .pill-count {
  display: inline-flex;
  align-items: center; justify-content: center;
  min-width: 16px;
  height: 16px;
  padding: 0 5px;
  border-radius: 999px;
  font-size: 10px;
  font-weight: 800;
  margin-left: 5px;
  background: color-mix(in oklab, var(--text) 12%, transparent);
  color: inherit;
}
.filter-btn.active .pill-count {
  background: rgba(255,255,255,.28);
  color: #fff;
}
.filter-sep {
  flex: 0 0 auto;
  width: 1px; height: 20px;
  background: var(--border);
  margin: 0 4px;
}
.clear-done-btn {
  margin-left: auto;
  padding: 5px 11px; border-radius: 999px;
  border: 1px dashed var(--border); background: transparent;
  color: var(--faint); font-size: 11.5px; font-weight: 600; font-family: inherit;
  cursor: pointer; transition: all .18s ease;
}
.clear-done-btn:hover { color: var(--red); border-color: var(--red); border-style: solid; }
.clear-done-btn:focus-visible { outline: 2px solid var(--red); outline-offset: 2px; }

/* ---- 屿事（待办清单） ---- */
.todo-list { display: flex; flex-direction: column; gap: 10px; }
.todo-item {
  display: flex; align-items: flex-start; gap: 12px;
  padding: 13px 16px 13px 22px;
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  transition: border-color .2s, box-shadow .2s, background .3s ease, transform .25s ease, opacity .35s ease;
  animation: todoIn .35s cubic-bezier(0.34,1.56,0.64,1) both;
  position: relative;
}
.todo-item:nth-child(1){animation-delay:0ms}
.todo-item:nth-child(2){animation-delay:24ms}
.todo-item:nth-child(3){animation-delay:48ms}
.todo-item:nth-child(4){animation-delay:72ms}
.todo-item:nth-child(5){animation-delay:96ms}
.todo-item:nth-child(n+6){animation-delay:120ms}
@keyframes todoIn { from { opacity:0; transform: translateX(-14px) scale(.98); } to { opacity:1; transform: translateX(0) scale(1); } }
.todo-item:hover { border-color: color-mix(in oklab, var(--accent) 50%, var(--border)); box-shadow: var(--shadow-lift); transform: translateY(-1px); }
.todo-item::before {
  content: ""; position: absolute; left: 0; top: 12px; bottom: 12px;
  width: 4px; border-radius: 0 4px 4px 0;
  background: var(--priority-mid);
  transition: width .2s ease, background .2s ease;
}
.todo-item.prio-high { background: var(--prio-high-bg); }
.todo-item.prio-high::before { background: var(--priority-high); box-shadow: 0 0 10px color-mix(in oklab, var(--priority-high) 50%, transparent); }
.todo-item.prio-mid::before { background: var(--priority-mid); }
.todo-item.prio-low { background: var(--prio-low-bg); }
.todo-item.prio-low::before { background: var(--priority-low); }
.todo-item.prio-high:hover::before { width: 6px; }
.todo-item.prio-mid:hover::before { width: 6px; }
.todo-item.prio-low:hover::before { width: 6px; }
.todo-item.completed { opacity: 0.78; }
.todo-item.completed:hover { opacity: 0.92; }
.todo-item.completed::after {
  content: "";
  position: absolute;
  inset: 0;
  border-radius: var(--radius);
  border: 1px dashed color-mix(in oklab, var(--green) 25%, transparent);
  pointer-events: none;
  animation: todoBreath 4.2s ease-in-out infinite;
}
@keyframes todoBreath {
  0%, 100% { opacity: 0.5; }
  50% { opacity: 1; }
}
.todo-item.completed .todo-title {
  text-decoration: line-through; color: var(--faint);
  transition: color .4s ease, text-decoration-color .4s ease, transform .4s ease;
}
.todo-item:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* 完成 checkbox */
.todo-check {
  width: 24px; height: 24px; border-radius: 50%;
  border: 2px solid var(--border); flex-shrink: 0;
  cursor: pointer; display: flex; align-items: center; justify-content: center;
  background: var(--panel-2);
  transition: all .25s cubic-bezier(0.34,1.56,0.64,1); margin-top: 2px;
  position: relative;
}
.todo-check:hover { border-color: var(--accent); transform: scale(1.12); box-shadow: 0 0 0 3px var(--accent-soft); }
.todo-check:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.todo-check.checked {
  background: var(--success); border-color: var(--success);
  transform: scale(1);
  box-shadow: 0 0 0 3px color-mix(in oklab, var(--success) 25%, transparent);
}
.todo-check.checked::after {
  content: '✓'; color: #fff; font-size: 13px; font-weight: 800;
  animation: checkPop .35s cubic-bezier(0.34,1.56,0.64,1);
}
@keyframes checkPop {
  0% { transform: scale(0) rotate(-45deg); }
  60% { transform: scale(1.25) rotate(5deg); }
  100% { transform: scale(1) rotate(0deg); }
}

.todo-body { flex: 1; min-width: 0; }
.todo-title {
  font-size: 14.5px; font-weight: 600; line-height: 1.45;
  word-break: break-word;
  transition: color .3s ease, text-decoration-color .3s ease;
}
.todo-meta {
  display: flex; align-items: center; gap: 8px;
  margin-top: 6px; flex-wrap: wrap;
}
.priority-badge {
  font-size: 11px; font-weight: 700; padding: 2px 9px;
  border-radius: 999px; letter-spacing: .3px;
}
.priority-high { background: var(--prio-high-bg); color: var(--priority-high); }
.priority-mid { background: var(--prio-mid-bg); color: var(--priority-mid); }
.priority-low { background: var(--prio-low-bg); color: var(--priority-low); }
.tag-badge {
  font-size: 11px; font-weight: 600; padding: 2px 9px;
  border-radius: 999px;
  background: var(--accent-soft); color: var(--accent);
  border: 1px solid color-mix(in oklab, var(--accent) 25%, transparent);
}
.meta-date { font-size: 11px; color: var(--faint); font-variant-numeric: tabular-nums; }
.meta-sep { color: var(--border); font-size: 11px; }

.todo-actions { display: flex; gap: 4px; flex-shrink: 0; align-items: flex-start; padding-top: 1px; }
.todo-del {
  width: 30px; height: 30px; border-radius: var(--radius-sm);
  border: none; background: transparent;
  color: var(--faint); font-size: 14px; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: all .18s ease;
}
.todo-del:hover { background: rgba(229,72,77,.12); color: var(--red); transform: scale(1.08); }
.todo-del:focus-visible { outline: 2px solid var(--red); outline-offset: 2px; background: rgba(229,72,77,.08); }

/* 空状态 */
.empty-state {
  text-align: center; padding: 44px 20px;
  color: var(--faint);
  animation: emptyIn .6s ease both;
}
@keyframes emptyIn {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: translateY(0); }
}
.empty-state .ip-stage { padding: 20px 0 8px; }
.empty-state .ip-stage-label { background: color-mix(in oklab, var(--accent) 10%, var(--panel)); }
.empty-state p { font-size: 14px; font-weight: 600; margin-top: 6px; }
.empty-actions {
  margin-top: 20px;
  display: flex;
  justify-content: center;
  gap: 10px;
  flex-wrap: wrap;
}
.empty-cta {
  padding: 8px 16px;
  border-radius: 999px;
  border: 1px solid var(--border);
  background: var(--panel-2);
  color: var(--text-2);
  font-size: 12px; font-weight: 700;
  cursor: pointer;
  transition: all .18s ease;
  font-family: inherit;
}
.empty-cta:hover { border-color: var(--accent); color: var(--accent); }
.empty-cta.primary {
  background: linear-gradient(135deg, var(--accent), var(--accent-2));
  color: #fff;
  border-color: transparent;
  box-shadow: 0 4px 12px color-mix(in oklab, var(--accent) 30%, transparent);
}
.empty-cta.primary:hover { opacity: .9; }
.empty-cta:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* 撤销 toast */
.undo-toast {
  position: fixed; left: 50%; bottom: 24px;
  transform: translateX(-50%) translateY(20px);
  padding: 12px 18px;
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  box-shadow: var(--shadow-lift);
  display: flex; align-items: center; gap: 12px;
  font-size: 13px; color: var(--text);
  opacity: 0; pointer-events: none;
  transition: opacity .25s ease, transform .25s ease;
  z-index: 100;
}
.undo-toast.show { opacity: 1; pointer-events: auto; transform: translateX(-50%) translateY(0); }
.undo-toast .undo-text { max-width: 260px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.undo-toast .undo-bar {
  position: absolute; left: 0; right: 0; bottom: 0;
  height: 3px; border-radius: 0 0 var(--radius) var(--radius);
  background: linear-gradient(90deg, var(--accent), var(--accent-2));
  animation: undoTimer 5s linear forwards;
}
.undo-cta {
  padding: 5px 12px; border-radius: 999px;
  border: 1px solid var(--accent); background: var(--accent-soft);
  color: var(--accent); font-size: 12px; font-weight: 700; font-family: inherit;
  cursor: pointer; transition: all .15s ease;
}
.undo-cta:hover { background: var(--accent); color: #fff; }
.undo-cta:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
@keyframes undoTimer { from { width: 100%; } to { width: 0%; } }

/* 彩纸 */
.confetti {
  position: fixed; top: 0; left: 0; width: 6px; height: 6px;
  z-index: 9999; pointer-events: none;
  animation: confettiFall 1s ease-out forwards;
  border-radius: 1px;
}
@keyframes confettiFall {
  0% { transform: translateY(0) rotate(0deg) scale(1); opacity: 1; }
  100% { transform: translateY(160px) rotate(540deg) scale(0.4); opacity: 0; }
}

/* 100% 完成彩蛋横幅 */
.full-done-banner {
  display: none;
  align-items: center;
  gap: 12px;
  padding: 14px 20px;
  margin-bottom: 18px;
  background: linear-gradient(135deg, color-mix(in oklab, var(--green) 18%, transparent), color-mix(in oklab, var(--accent) 12%, transparent));
  border: 1px solid color-mix(in oklab, var(--green) 25%, var(--border));
  border-radius: var(--radius);
  font-size: 14px;
  color: var(--text);
  font-weight: 700;
  animation: slideInTop .5s ease both;
}
.full-done-banner.show { display: flex; }
.full-done-banner .fd-emoji { font-size: 22px; }
.full-done-banner .fd-mascot { width: 36px; margin-left: auto; flex-shrink: 0; }

/* 快捷键提示 */
.kbd-hint {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  margin-left: 6px;
  font-size: 10.5px;
  color: var(--faint);
  font-weight: 600;
}
.kbd {
  display: inline-block;
  padding: 1px 5px;
  border-radius: 4px;
  border: 1px solid var(--border);
  background: var(--panel-2);
  font-family: ui-monospace, Menlo, monospace;
  font-size: 10px;
  font-weight: 700;
  color: var(--text-2);
}

@media (max-width: 600px) {
  .stats-row { grid-template-columns: repeat(2, 1fr); }
  .add-form-row { flex-wrap: wrap; }
  .add-form-row > * { flex: 1 1 calc(50% - 4px); }
  .add-btn { flex: 1 1 100%; }
  .container { padding: 20px 14px 44px; }
  .progress-info { min-width: 108px; }
  .progress-text { font-size: 15px; }
  .filter-bar { gap: 4px; padding: 8px 10px; }
  .welcome-bar .w-tip { display: none; }
  .kbd-hint { display: none; }
}

/* 顶部 skip link（无障碍） */
.skip-link {
  position: fixed; top: 6px; left: 6px;
  padding: 8px 14px; border-radius: 8px;
  background: var(--accent); color: #fff;
  font-weight: 800; font-size: 13px;
  z-index: 100;
  transform: translateY(-140%);
  transition: transform .2s;
  text-decoration: none;
}
.skip-link:focus { transform: translateY(0); }

/* 尊重用户降运动偏好 */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.01s !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01s !important;
  }
  .ip-mascot { animation: none !important; }
  .ip-mascot--blink .ip-face { animation: none !important; }
}

/* 涟漪反馈 */
.ripple {
  position: absolute; border-radius: 50%;
  background: rgba(255,255,255,0.42);
  transform: scale(0);
  animation: ripple-anim 0.55s ease-out forwards;
  pointer-events: none; z-index: 1;
}
@keyframes ripple-anim {
  0% { transform: scale(0); opacity: 1; }
  100% { transform: scale(4); opacity: 0; }
}

/* ---- 编辑待办 ---- */
.todo-edit {
  width: 30px; height: 30px; border-radius: var(--radius-sm);
  border: none; background: transparent;
  color: var(--faint); font-size: 13px; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: all .18s ease;
}
.todo-edit:hover { background: var(--accent-soft); color: var(--accent); transform: scale(1.08); }
.todo-edit:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.todo-item.editing { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft), var(--shadow); }
.edit-form {
  display: flex; flex-direction: column; gap: 8px;
  width: 100%;
}
.edit-form-row { display: flex; gap: 8px; flex-wrap: wrap; }
.edit-form input[type="text"],
.edit-form select {
  flex: 1; min-width: 140px; padding: 8px 12px;
  border-radius: var(--radius-sm);
  border: 1px solid var(--border); background: var(--panel-2);
  color: var(--text); font-size: 13px; font-family: inherit;
  outline: none; transition: border-color .2s, box-shadow .2s;
}
.edit-form input[type="text"]:focus,
.edit-form select:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px var(--accent-soft);
  background: var(--panel);
}
.edit-actions { display: flex; gap: 8px; }
.edit-save, .edit-cancel {
  padding: 7px 16px; border-radius: 999px;
  border: none; font-size: 12.5px; font-weight: 700; font-family: inherit;
  cursor: pointer; transition: all .18s ease;
}
.edit-save {
  background: linear-gradient(135deg, var(--accent), var(--accent-2));
  color: #fff; box-shadow: 0 3px 10px color-mix(in oklab, var(--accent) 30%, transparent);
}
.edit-save:hover { opacity: .92; }
.edit-cancel {
  background: var(--panel-2); border: 1px solid var(--border); color: var(--text-2);
}
.edit-cancel:hover { border-color: var(--accent); color: var(--accent); }
.edit-save:focus-visible, .edit-cancel:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* ---- 截止日期徽标 ---- */
.due-badge {
  font-size: 11px; font-weight: 700; padding: 2px 9px;
  border-radius: 999px; letter-spacing: .3px;
  background: var(--accent-soft); color: var(--accent);
  border: 1px solid color-mix(in oklab, var(--accent) 25%, transparent);
}
.due-today { background: color-mix(in oklab, #f59e0b 16%, transparent); color: #d97706; border-color: color-mix(in oklab, #f59e0b 45%, transparent); }
.due-overdue { background: color-mix(in oklab, #ef4444 14%, transparent); color: var(--red); border-color: color-mix(in oklab, #ef4444 45%, transparent); }
.todo-item.due-overdue-item { border-color: color-mix(in oklab, var(--red) 45%, var(--border)); }
.todo-item.due-overdue-item::before { background: var(--red); box-shadow: 0 0 10px color-mix(in oklab, var(--red) 50%, transparent); }
.add-form input[type="date"] {
  flex: 0 0 auto; padding: 10px 12px; border-radius: var(--radius-sm);
  border: 1px solid var(--border); background: var(--panel-2);
  color: var(--text); font-size: 13px; font-family: inherit;
  outline: none; transition: border-color .2s, box-shadow .2s, background .2s;
}
.add-form input[type="date"]:focus,
.add-form input[type="date"]:focus-visible {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px var(--accent-soft);
  background: var(--panel);
}

/* ---- 搜索 ---- */
.todo-search {
  flex: 1 1 160px; min-width: 140px;
  padding: 6px 12px; border-radius: 999px;
  border: 1px solid var(--border); background: var(--panel-2);
  color: var(--text); font-size: 12.5px; font-family: inherit;
  outline: none; transition: border-color .2s, box-shadow .2s;
}
.todo-search:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.todo-search:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.todo-search::placeholder { color: var(--faint); }

/* ---- 备份 ---- */
.backup-btns { display: flex; gap: 6px; margin-left: auto; }
.backup-btn {
  padding: 5px 11px; border-radius: 999px;
  border: 1px dashed var(--border); background: transparent;
  color: var(--faint); font-size: 11.5px; font-weight: 600; font-family: inherit;
  cursor: pointer; transition: all .18s ease;
}
.backup-btn:hover { color: var(--accent); border-color: var(--accent); border-style: solid; }
.backup-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.backup-btn.danger:hover { color: var(--red); border-color: var(--red); }
#backupFile { display: none; }

/* 本周战绩 */
.weekly-row {
  display: flex; align-items: stretch; gap: 10px;
  margin-bottom: 20px; flex-wrap: wrap;
}
.wk-item {
  flex: 1 1 150px;
  display: flex; align-items: center; gap: 8px;
  padding: 12px 14px;
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  animation: cardPop .5s cubic-bezier(0.34,1.56,0.64,1) both;
}
.wk-item:nth-child(2) { animation-delay: 80ms; }
.wk-item:nth-child(3) { animation-delay: 160ms; }
.wk-ico { font-size: 17px; line-height: 1; }
.wk-label { font-size: 12.5px; color: var(--faint); font-weight: 600; }
.wk-item b {
  margin-left: auto;
  font-size: 22px; font-weight: 800; line-height: 1;
  font-variant-numeric: tabular-nums;
  color: var(--accent);
}
.wk-unit { font-size: 12px; color: var(--faint); margin-left: -4px; }
.wk-item.warn b { color: var(--red); }

/* ---- 重复 / 提醒 / 子任务 ---- */
.repeat-badge {
  font-size: 11px; font-weight: 700; padding: 2px 9px;
  border-radius: 999px; letter-spacing: .3px;
  background: color-mix(in oklab, #8b5cf6 14%, transparent); color: #7c3aed;
  border: 1px solid color-mix(in oklab, #8b5cf6 30%, transparent);
}
.repeat-badge[data-repeat="daily"] { background: color-mix(in oklab, #0ea5e9 14%, transparent); color: #0369a1; border-color: color-mix(in oklab, #0ea5e9 30%, transparent); }
.repeat-badge[data-repeat="weekly"] { background: color-mix(in oklab, #8b5cf6 14%, transparent); color: #7c3aed; border-color: color-mix(in oklab, #8b5cf6 30%, transparent); }
.repeat-badge[data-repeat="monthly"] { background: color-mix(in oklab, #f59e0b 14%, transparent); color: #b45309; border-color: color-mix(in oklab, #f59e0b 30%, transparent); }
.todo-item[data-repeat] .todo-title::before { content: '🔁 '; }

.subtask-section { margin-top: 9px; padding-top: 8px; border-top: 1px dashed var(--border-soft); }
.subtask-header { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 7px; }
.subtask-title { font-size: 12px; font-weight: 800; color: var(--text-2); }
.subtask-progress { font-size: 11px; color: var(--faint); font-variant-numeric: tabular-nums; }
.subtask-list { display: flex; flex-direction: column; gap: 5px; }
.subtask {
  display: flex; align-items: center; gap: 8px;
  padding: 5px 8px; border-radius: 9px;
  background: color-mix(in oklab, var(--panel-2) 70%, transparent);
  border: 1px solid var(--border-soft);
  font-size: 12.5px;
}
.subtask-check {
  width: 17px; height: 17px; border-radius: 5px;
  border: 1.5px solid var(--border); background: var(--panel-2);
  flex-shrink: 0; cursor: pointer; display: flex; align-items: center; justify-content: center;
  transition: all .18s ease; color: #fff; font-size: 11px; font-weight: 800;
}
.subtask-check:hover { border-color: var(--accent); transform: scale(1.08); }
.subtask-check:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.subtask-check.checked { background: var(--success); border-color: var(--success); }
.subtask-title-text { flex: 1; min-width: 0; word-break: break-word; }
.subtask.done .subtask-title-text { text-decoration: line-through; color: var(--faint); }
.subtask-del {
  border: 0; background: transparent; color: var(--faint);
  cursor: pointer; padding: 2px 4px; border-radius: 6px; font-size: 11px; line-height: 1;
}
.subtask-del:hover { color: var(--red); background: rgba(229,72,77,.10); }
.subtask-del:focus-visible { outline: 2px solid var(--red); outline-offset: 2px; }
.subtask-add-row { display: flex; gap: 6px; margin-top: 7px; }
.subtask-add-row input {
  flex: 1; min-width: 0; padding: 6px 9px; border-radius: 8px;
  border: 1px solid var(--border); background: var(--panel-2); color: var(--text);
  font-size: 12px; font-family: inherit; outline: none;
}
.subtask-add-row input:focus { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-soft); }
.subtask-add-btn {
  padding: 6px 10px; border: 0; border-radius: 8px; background: var(--accent-soft);
  color: var(--accent); font-size: 12px; font-weight: 700; font-family: inherit; cursor: pointer;
}
.subtask-add-btn:hover { background: var(--accent); color: #fff; }
.subtask-add-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* ---- 视图切换 / 日历 / 趋势 / 提醒 ---- */
.view-bar {
  display: flex; align-items: center; justify-content: space-between; gap: 10px;
  margin-bottom: 14px; flex-wrap: wrap;
  padding: 9px 11px; background: var(--panel); border: 1px solid var(--border);
  border-radius: var(--radius); box-shadow: var(--shadow);
}
.view-tabs, .reminder-wrap { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.view-tab {
  padding: 6px 12px; border-radius: 999px; border: 1px solid var(--border);
  background: var(--panel-2); color: var(--text-2); font-size: 12px; font-weight: 700;
  font-family: inherit; cursor: pointer; transition: all .18s ease;
}
.view-tab:hover { border-color: var(--accent); color: var(--accent); }
.view-tab.active { background: linear-gradient(135deg, var(--accent), var(--accent-2)); color: #fff; border-color: transparent; }
.view-tab:focus-visible, .reminder-wrap button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.view-summary { font-size: 12px; color: var(--faint); font-weight: 600; }
.reminder-wrap select, .reminder-wrap input {
  padding: 5px 8px; border-radius: 999px; border: 1px solid var(--border);
  background: var(--panel-2); color: var(--text); font-size: 11.5px; font-family: inherit;
}
.reminder-toggle { padding: 5px 10px; border-radius: 999px; border: 1px solid var(--border); background: var(--panel-2); color: var(--text-2); font-size: 11.5px; font-weight: 700; font-family: inherit; cursor: pointer; }
.reminder-toggle.on { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
.view-calendar { padding-bottom: 42px; }
.calendar { display: flex; flex-direction: column; gap: 12px; }
.calendar-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius); padding: 10px 12px; box-shadow: var(--shadow); }
.calendar-title { font-size: 15px; font-weight: 800; }
.calendar-nav { display: flex; gap: 6px; }
.calendar-nav button { width: 32px; height: 32px; border-radius: 8px; border: 1px solid var(--border); background: var(--panel-2); cursor: pointer; font-weight: 800; color: var(--text-2); }
.calendar-nav button:hover { color: var(--accent); border-color: var(--accent); }
.calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px; }
.calendar-cell {
  min-height: 96px; padding: 8px; border-radius: 12px;
  background: var(--panel); border: 1px solid var(--border); box-shadow: var(--shadow);
  display: flex; flex-direction: column; gap: 6px;
}
.calendar-cell.weekend { background: color-mix(in oklab, var(--panel) 94%, var(--panel-2)); }
.calendar-cell.today { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft), var(--shadow); }
.calendar-cell.empty { background: transparent; border-color: transparent; box-shadow: none; min-height: 22px; opacity: 0; pointer-events: none; }
.cal-date { display: flex; align-items: center; justify-content: space-between; font-size: 12px; font-weight: 800; color: var(--text-2); }
.cal-count { font-size: 10px; color: var(--faint); padding: 1px 5px; border-radius: 999px; background: var(--panel-2); border: 1px solid var(--border-soft); }
.cal-list { display: flex; flex-direction: column; gap: 3px; overflow: hidden; }
.cal-todo {
  font-size: 11px; line-height: 1.25; padding: 3px 5px; border-radius: 6px;
  background: var(--panel-2); border-left: 3px solid var(--priority-mid);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.cal-todo.prio-high { border-left-color: var(--priority-high); }
.cal-todo.prio-low { border-left-color: var(--priority-low); }
.cal-todo.done { opacity: .6; text-decoration: line-through; }
.cal-more { font-size: 10px; color: var(--faint); font-weight: 700; }
.trend-card { background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px 14px 10px; box-shadow: var(--shadow); margin-bottom: 18px; }
.trend-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 12px; }
.trend-title { font-size: 13.5px; font-weight: 800; }
.trend-legend { font-size: 11px; color: var(--faint); }
.trend-chart { display: grid; grid-template-columns: repeat(7, 1fr); gap: 10px; align-items: end; height: 128px; padding: 0 2px; }
.trend-col { display: flex; flex-direction: column; align-items: center; justify-content: flex-end; gap: 5px; height: 100%; }
.trend-bars { display: flex; align-items: flex-end; gap: 4px; width: 100%; height: 88px; justify-content: center; }
.trend-bar { width: 14px; border-radius: 6px 6px 3px 3px; min-height: 2px; background: linear-gradient(180deg, var(--accent), var(--accent-2)); box-shadow: 0 3px 8px color-mix(in oklab, var(--accent) 22%, transparent); transition: height .5s ease; }
.trend-bar.secondary { background: color-mix(in oklab, var(--text) 24%, transparent); box-shadow: none; opacity: .7; }
.trend-label { font-size: 10.5px; color: var(--faint); font-weight: 700; }
.trend-value { font-size: 10.5px; color: var(--text-2); font-weight: 800; }
.notice {
  position: fixed; right: 18px; top: 74px; z-index: 120;
  width: min(330px, calc(100vw - 36px)); max-height: 38vh; overflow: auto;
  padding: 12px 12px 10px; border-radius: var(--radius); border: 1px solid var(--border);
  background: color-mix(in oklab, var(--panel) 94%, transparent); box-shadow: var(--shadow-lift);
  backdrop-filter: blur(12px); display: none;
}
.notice.show { display: block; animation: slideInTop .25s ease both; }
.notice-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
.notice-title { font-size: 13px; font-weight: 800; }
.notice-clear { border: 1px solid var(--border); background: var(--panel-2); color: var(--faint); border-radius: 999px; padding: 3px 8px; font-size: 10.5px; font-family: inherit; cursor: pointer; }
.notice-clear:hover { color: var(--red); border-color: var(--red); }
.notice-empty { font-size: 12px; color: var(--faint); text-align: center; padding: 8px 0; }
.notice-item { display: flex; align-items: flex-start; gap: 7px; padding: 7px 8px; border-radius: 9px; background: var(--panel-2); border: 1px solid var(--border-soft); margin-top: 5px; font-size: 12px; }
.notice-dot { flex-shrink: 0; width: 7px; height: 7px; margin-top: 5px; border-radius: 50%; background: var(--accent); }
.notice-body { flex: 1; min-width: 0; }
.notice-title-text { font-weight: 700; word-break: break-word; }
.notice-time { font-size: 10.5px; color: var(--faint); margin-top: 2px; }
.notice-go { border: 1px solid var(--accent); background: var(--accent-soft); color: var(--accent); border-radius: 999px; padding: 3px 8px; font-size: 10.5px; font-weight: 800; font-family: inherit; cursor: pointer; }
.notice-go:hover { background: var(--accent); color: #fff; }

/* ---- 番茄钟 ---- */
.pomo-panel { display: none; position: fixed; right: 18px; bottom: 18px; z-index: 130; width: min(320px, calc(100vw - 36px)); padding: 16px; background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow-lift); }
.pomo-panel.show { display: block; animation: slideInTop .25s ease both; }
.pomo-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.pomo-title { font-size: 14px; font-weight: 800; }
.pomo-mode { color: var(--faint); font-size: 11px; }
.pomo-clock { text-align: center; font-size: 42px; line-height: 1.1; font-weight: 900; letter-spacing: 2px; margin: 14px 0 10px; font-variant-numeric: tabular-nums; background: linear-gradient(135deg, var(--accent), var(--accent-2)); -webkit-background-clip: text; background-clip: text; color: transparent; }
.pomo-task { width: 100%; padding: 7px 9px; border: 1px solid var(--border); border-radius: 8px; background: var(--panel-2); color: var(--text); font: inherit; font-size: 12px; }
.pomo-actions { display: flex; gap: 7px; margin-top: 10px; }
.pomo-actions button { flex: 1; padding: 7px 9px; border: 1px solid var(--border); border-radius: 8px; background: var(--panel-2); color: var(--text-2); font: inherit; font-size: 12px; font-weight: 700; cursor: pointer; }
.pomo-actions button:hover { color: var(--accent); border-color: var(--accent); }
.pomo-count { margin-top: 9px; text-align: center; color: var(--faint); font-size: 11px; }
</style>
</head>
<body>

<main class="container">

  <div class="welcome-bar" id="welcomeBar" aria-hidden="true">
    <span class="w-mascot ip-mascot ip-mascot--tiny ip-mascot--wave ip-mascot--blink"><span id="welcomeMascotSvg"></span></span>
    <span id="welcomeText"><strong>你好呀！</strong> 今日待办，交给屿咪陪你一起搞定 ✨</span>

  <div class="full-done-banner" id="fullDoneBanner" aria-live="polite">
    <span class="fd-emoji">🏆</span>

    <span class="fd-mascot ip-mascot ip-mascot--small ip-mascot--happy ip-mascot--blink"><span id="fullDoneMascotSvg"></span></span>

  <div class="stats-row" id="statsRow">
    <div class="stat-card" data-stat="total"><span class="stat-ico">📋</span><div class="stat-num" id="statTotal">0</div><div class="stat-label">全部</div></div>

  <div class="add-form" id="addForm">
    <div class="add-form-row">
      <input type="text" id="todoInput" placeholder="✏️  输入待办…支持「明天 !1 #工作」自然语法" maxlength="200" autocomplete="off" aria-label="待办事项">

<script>
(function() {
  'use strict';
  const STORAGE_KEY = 'yuhang_todos_v1';
  const REMINDER_STATE_KEY = 'yuhang_todo_reminders_v1';
  let todos = [];
  let currentFilter = 'all';
  let currentTagFilter = null;
  let searchKeyword = '';
  let editingId = null;
  let trash = null;
  let trashTimer = null;
  let currentView = 'list';
  let calendarCursor = new Date();
  calendarCursor.setHours(0, 0, 0, 0);
  let reminders = [];
  let reminderEnabled = true;
  let reminderAt = '09:00';
  let browserReminderOn = false;
  let browserReminderPrompted = false;
  let reminderTimer = null;
  let activeReminders = {};
  const POMO_KEY = 'yuhang_todo_pomo_v1';
  let pomo = { left: 1500, running: false, timer: null, completed: 0, mode: 'focus', startedAt: 0 };

  function uid() { return Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 8); }
  function pomoFormat(sec) { return String(Math.floor(sec / 60)).padStart(2, '0') + ':' + String(sec % 60).padStart(2, '0'); }
  function renderPomo() {
    var clock = document.getElementById('pomoClock'); if (clock) clock.textContent = pomoFormat(pomo.left);
    var mode = document.getElementById('pomoMode'); if (mode) mode.textContent = pomo.mode === 'focus' ? '专注 25 分钟' : '休息 5 分钟';
    var start = document.getElementById('pomoStart'); if (start) start.textContent = pomo.running ? '暂停' : '开始';
    var count = document.getElementById('pomoCount'); if (count) count.textContent = '今日完成 ' + pomo.completed + ' 个番茄';
  }
  function openPomo() { var p = document.getElementById('pomoPanel'); if (!p) return; p.classList.add('show'); var sel = document.getElementById('pomoTask'); if (sel) sel.innerHTML = '<option value="">不关联待办</option>' + todos.filter(function(t){return !t.done;}).map(function(t){return '<option value="' + escapeHtml(t.id) + '">' + escapeHtml(t.title) + '</option>';}).join(''); renderPomo(); }
  function tickPomo() { if (!pomo.running) return; pomo.left = Math.max(0, pomo.left - 1); renderPomo(); if (pomo.left === 0) { pomo.running = false; if (pomo.mode === 'focus') pomo.completed++; pomo.mode = pomo.mode === 'focus' ? 'break' : 'focus'; pomo.left = pomo.mode === 'focus' ? 1500 : 300; savePomo(); addSuccessFlash(pomo.mode === 'break' ? '🍅 专注完成，休息一下吧' : '🌱 休息结束，继续出发'); } }
  function savePomo() { try { localStorage.setItem(POMO_KEY, JSON.stringify({ completed: pomo.completed })); } catch (e) {} }
  function loadPomo() { try { var x = JSON.parse(localStorage.getItem(POMO_KEY) || 'null'); if (x && typeof x.completed === 'number') pomo.completed = x.completed; } catch (e) {} }

  function load() {
    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      if (raw) todos = JSON.parse(raw);
      if (!Array.isArray(todos)) todos = [];
    } catch (e) { todos = []; }
  }
  function save() {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(todos)); } catch (e) {}
    saveRemindersState();
  }

  function loadRemindersState() {
    try {
      var rawState = localStorage.getItem(REMINDER_STATE_KEY);
      if (rawState) {
        var state = JSON.parse(rawState);
        if (Array.isArray(state.reminders)) reminders = state.reminders.filter(function(r) { return r && typeof r.key === 'string'; });
        if (typeof state.reminderEnabled === 'boolean') reminderEnabled = state.reminderEnabled;
        if (/^\d{2}:\d{2}$/.test(state.reminderAt || '')) reminderAt = state.reminderAt;
        if (typeof state.browserReminderOn === 'boolean') browserReminderOn = state.browserReminderOn;
        if (typeof state.browserReminderPrompted === 'boolean') browserReminderPrompted = state.browserReminderPrompted;
      }
    } catch (e) {}
    var timeInput = document.getElementById('reminderAt');
    if (timeInput) timeInput.value = reminderAt;
    var browserBtn = document.getElementById('browserRemindBtn');
    if (browserBtn) browserBtn.classList.toggle('on', browserReminderOn);
  }
  function saveRemindersState() {
    try {
      localStorage.setItem(REMINDER_STATE_KEY, JSON.stringify({ reminders: reminders, reminderEnabled: reminderEnabled, reminderAt: reminderAt, browserReminderOn: browserReminderOn, browserReminderPrompted: browserReminderPrompted }));
    } catch (e) {}
  }
  function normalizeTodos(input) {
    if (!Array.isArray(input)) return [];
    return input.map(function(rawTodo) {
      var t = rawTodo && typeof rawTodo === 'object' ? rawTodo : {};
      t.done = !!t.done;
      t.subtasks = Array.isArray(t.subtasks) ? t.subtasks.map(function(s) { return { id: String((s && s.id) || uid()), text: String((s && s.text) || '').slice(0, 200), done: !!(s && s.done) }; }) : [];
      var repeat = t.repeat === 'daily' || t.repeat === 'weekly' || t.repeat === 'monthly' ? t.repeat : null;
      if (!repeat) delete t.repeat;
      return {
        id: String(t.id || uid()),
        title: String(t.title || '').slice(0, 200),
        tag: t.tag ? String(t.tag).slice(0, 30) : null,
        priority: t.priority === 'high' || t.priority === 'low' ? t.priority : 'mid',
        due: /^\d{4}-\d{2}-\d{2}$/.test(t.due || '') ? t.due : null,
        repeat: repeat,
        done: t.done,
        subtasks: t.subtasks,
        createdAt: Number(t.createdAt) || Date.now(),
        completedAt: t.completedAt ? Number(t.completedAt) : null
      };
    });
  }
  function nextRepeatDue(from, repeat) {
    if (repeat !== 'daily' && repeat !== 'weekly' && repeat !== 'monthly') return null;
    var d = /^\d{4}-\d{2}-\d{2}$/.test(from || '') ? new Date(from + 'T00:00:00') : new Date();
    d.setHours(0, 0, 0, 0);
    if (repeat === 'daily') d.setDate(d.getDate() + 1);
    else if (repeat === 'weekly') d.setDate(d.getDate() + 7);
    else if (repeat === 'monthly') d.setMonth(d.getMonth() + 1);
    return isoDate(d);
  }

  function getFiltered() {
    var list = todos;
    if (currentTagFilter) list = list.filter(function(t) { return t.tag === currentTagFilter; });
    if (searchKeyword) {
      var kw = searchKeyword.toLowerCase();
      list = list.filter(function(t) {
        return (t.title || '').toLowerCase().indexOf(kw) !== -1 ||
               (t.tag || '').toLowerCase().indexOf(kw) !== -1;
      });
    }
    switch (currentFilter) {
      case 'active': return list.filter(function(t) { return !t.done; });
      case 'done': return list.filter(function(t) { return t.done; });
      case 'high': return list.filter(function(t) { return t.priority === 'high'; });
      case 'mid': return list.filter(function(t) { return t.priority === 'mid'; });
      case 'low': return list.filter(function(t) { return t.priority === 'low'; });
      default: return list;
    }
  }

  function repeatLabel(repeat) {
    return repeat === 'daily' ? '每天' : repeat === 'weekly' ? '每周' : repeat === 'monthly' ? '每月' : '';
  }
  function subtaskStats(t) {
    var list = Array.isArray(t.subtasks) ? t.subtasks : [];
    var done = list.filter(function(s) { return s && s.done; }).length;
    return { total: list.length, done: done, pct: list.length ? Math.round(done / list.length * 100) : 0 };
  }
  function subtasksBadgeHtml(t) {
    var st = subtaskStats(t);
    return '<span class="repeat-badge" data-repeat="subtasks" title="子任务">🧩 ' + st.done + '/' + st.total + '</span>';
  }
  function subtasksHtml(t) {
    var st = subtaskStats(t);
    var html = '<div class="subtask-section">' +
      '<div class="subtask-header"><span class="subtask-title">🧩 子任务</span><span class="subtask-progress">' + st.done + '/' + st.total + ' · ' + st.pct + '%</span></div>';
    if (st.total) {
      html += '<div class="subtask-list">';
      for (var i = 0; i < t.subtasks.length; i++) {
        var s = t.subtasks[i];
        html += '<div class="subtask' + (s.done ? ' done' : '') + '">' +
          '<div class="subtask-check' + (s.done ? ' checked' : '') + '" data-action="toggle-subtask" data-id="' + escapeHtml(t.id) + '" data-sid="' + escapeHtml(s.id) + '" tabindex="0" role="button" aria-label="' + (s.done ? '取消完成子任务' : '完成子任务') + '">' + (s.done ? '✓' : '') + '</div>' +
          '<span class="subtask-title-text">' + escapeHtml(s.text) + '</span>' +
          '<button class="subtask-del" data-action="delete-subtask" data-id="' + escapeHtml(t.id) + '" data-sid="' + escapeHtml(s.id) + '" title="删除子任务" aria-label="删除子任务">✕</button>' +
          '</div>';
      }
      html += '</div>';
    }
    html += '<div class="subtask-add-row">' +
      '<input type="text" data-action="subtask-input" data-id="' + escapeHtml(t.id) + '" placeholder="添加子任务，回车保存" maxlength="100" aria-label="添加子任务">' +
      '<button class="subtask-add-btn" data-action="add-subtask" data-id="' + escapeHtml(t.id) + '">＋</button>' +
      '</div></div>';
    return html;
  }

  function countFilterCounts() {
    var total = todos.length;
    var done = todos.filter(function(t) { return t.done; }).length;
    var active = total - done;
    var high = todos.filter(function(t) { return t.priority === 'high'; }).length;
    var mid = todos.filter(function(t) { return t.priority === 'mid'; }).length;
    var low = todos.filter(function(t) { return t.priority === 'low'; }).length;
    return { total: total, active: active, done: done, high: high, mid: mid, low: low };
  }

  function renderFilterCounts() {
    var c = countFilterCounts();
    var fill = function(id, v) {
      var el = document.getElementById(id);
      if (el) el.textContent = v;
    };
    fill('countAll', c.total);
    fill('countActive', c.active);
    fill('countDone', c.done);
    fill('countHigh', c.high);
    fill('countMid', c.mid);
    fill('countLow', c.low);
  }

  function countUp(el, target) {
    if (!el) return;
    var cur = parseInt(el.textContent, 10) || 0;
    if (cur === target) return;
    var t0 = null, dur = 500;
    function step(ts) {
      if (!t0) t0 = ts;
      var p = Math.min((ts - t0) / dur, 1);
      var eased = 1 - Math.pow(1 - p, 3);
      el.textContent = Math.round(cur + (target - cur) * eased);
      if (p < 1) requestAnimationFrame(step);
      else el.textContent = target;
    }
    requestAnimationFrame(step);
  }

  function chimp(el) {
    if (!el) return;
    el.classList.remove('chimp');
    void el.offsetWidth;
    el.classList.add('chimp');
  }

  function updateStats() {
    var total = todos.length;
    var done = todos.filter(function(t) { return t.done; }).length;
    var todo = total - done;
    var high = todos.filter(function(t) { return t.priority === 'high' && !t.done; }).length;
    var pct = total ? Math.round(done / total * 100) : 0;

    countUp(document.getElementById('statTotal'), total);
    countUp(document.getElementById('statDone'), done);
    countUp(document.getElementById('statTodo'), todo);
    countUp(document.getElementById('statHigh'), high);
    chimp(document.getElementById('statTotal'));
    chimp(document.getElementById('statDone'));
    chimp(document.getElementById('statTodo'));
    chimp(document.getElementById('statHigh'));

    var fill = document.getElementById('progressFill');
    var text = document.getElementById('progressText');
    if (fill) fill.style.width = pct + '%';
    if (text) text.textContent = pct + '%';

    updateProgressEmoji(pct, total, done);
    updateWeekly();
    updateTrend();
    updateMascotExpression();
    updateClearDone();
    updateWelcome(total, done);
    updateFullDone(total, done);
    renderFilterCounts();
  }

  // 本周完成 / 连续打卡 / 已逾期
  function updateWeekly() {
    var today = new Date(); today.setHours(0, 0, 0, 0);
    // 本周一（周日按上周日处理，保持一周=周一~周日）
    var dow = today.getDay() === 0 ? 7 : today.getDay();
    var monday = new Date(today.getTime()); monday.setDate(today.getDate() - (dow - 1));

    var weekDone = 0, overdue = 0;
    var doneDays = {};
    todos.forEach(function(t) {
      if (t.completedAt) {
        var d = new Date(t.completedAt);
        if (d >= monday) weekDone++;
        doneDays[isoDate(d)] = true;
      }
      if (t.due && !t.done) {
        var due = new Date(t.due + 'T00:00:00');
        if (!isNaN(due.getTime()) && due < today) overdue++;
      }
    });

    // 连续打卡：从今天往前数，今天没完成则从昨天起算
    var streak = 0;
    var cursor = new Date(today.getTime());
    if (!doneDays[isoDate(cursor)]) cursor.setDate(cursor.getDate() - 1);
    while (doneDays[isoDate(cursor)]) {
      streak++;
      cursor.setDate(cursor.getDate() - 1);
    }

    setStat('statWeek', weekDone);
    setStat('statStreak', streak);
    setStat('statOverdue', overdue);
    var row = document.getElementById('weeklyRow');
    if (row && row.children[2]) {
      row.children[2].classList.toggle('warn', overdue > 0);
    }
  }

  function updateTrend() {
    var chart = document.getElementById('trendChart');
    var totalDoneEl = document.getElementById('trendTotalDone');
    var rateEl = document.getElementById('trendCompletionRate');
    if (!chart) return;
    var today = new Date(); today.setHours(0, 0, 0, 0);
    var days = [];
    for (var i = 6; i >= 0; i--) {
      var d = new Date(today.getTime()); d.setDate(d.getDate() - i);
      var key = isoDate(d);
      days.push({ key: key, label: '周' + '一二三四五六日'[(d.getDay() + 6) % 7], done: 0, due: 0 });
    }
    var byKey = {};
    days.forEach(function(day) { byKey[day.key] = day; });
    todos.forEach(function(t) {
      if (t.completedAt && byKey[isoDate(new Date(t.completedAt))]) byKey[isoDate(new Date(t.completedAt))].done++;
      if (t.due && byKey[t.due]) byKey[t.due].due++;
    });
    var max = Math.max(1, days.reduce(function(m, d) { return Math.max(m, d.done, d.due); }, 0));
    var totalDone7 = days.reduce(function(sum, d) { return sum + d.done; }, 0);
    var totalDue7 = days.reduce(function(sum, d) { return sum + d.due; }, 0);
    var html = days.map(function(d) {
      var doneH = Math.max(3, Math.round(d.done / max * 82));
      var dueH = Math.max(3, Math.round(d.due / max * 82));
      return '<div class="trend-col"><div class="trend-value">' + d.done + '</div><div class="trend-bars">' +
        '<span class="trend-bar" style="height:' + doneH + 'px"></span>' +
        '<span class="trend-bar secondary" style="height:' + dueH + 'px"></span>' +
        '</div><div class="trend-label">' + d.label + '</div></div>';
    }).join('');
    chart.innerHTML = html;
    if (totalDoneEl) totalDoneEl.textContent = totalDone7;
    if (rateEl) rateEl.textContent = (totalDue7 ? Math.round(totalDone7 / totalDue7 * 100) : (totalDone7 ? 100 : 0)) + '%';
  }

    for (var i = 0; i < 28; i++) {

      var dx = Math.cos(angle) * dist;
      var dy = -Math.abs(Math.sin(angle) * dist) - 10;
      el.style.left = (x + dx) + 'px';
      el.style.top = (y + dy) + 'px';
      el.style.background = colors[i % colors.length];
      el.style.animationDelay = (Math.random() * 0.12) + 's';

      el.style.height = (4 + Math.random() * 5) + 'px';

  function purgeTrash() {

  function renderTags() {
    var tagSet = [];
    var seen = {};
    for (var i = 0; i < todos.length; i++) {
      var tag = todos[i].tag;
      if (tag && !seen[tag]) { seen[tag] = true; tagSet.push(tag); }
    }
    var container = document.getElementById('tagFilters');
    if (!tagSet.length) { container.innerHTML = ''; return; }
    var html = '<span class="filter-sep"></span>';
    for (var j = 0; j < tagSet.length; j++) {
      var t = tagSet[j];
      var active = (currentTagFilter === t) ? 'active' : '';
      html += '<button class="filter-btn' + active + '" data-tag="' + escapeHtml(t) + '">' + escapeHtml(t) + '</button>';
    }
    container.innerHTML = html;
    var btns = container.querySelectorAll('[data-tag]');
    for (var k = 0; k < btns.length; k++) {
      (function(btn) {
        btn.addEventListener('click', function() {
          if (currentTagFilter === btn.dataset.tag) currentTagFilter = null;
          else currentTagFilter = btn.dataset.tag;
          render();
        });
      })(btns[k]);
    }
  }

  function escapeHtml(s) {
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }
  function makeRipple(el, x, y) {
    if (!el || !el.getBoundingClientRect) return;
    var r = el.getBoundingClientRect();
    var dx = x - r.left, dy = y - r.top;
    var sz = Math.max(r.width, r.height) * 2;
    var d = document.createElement('span');
    d.className = 'ripple';
    d.style.width = d.style.height = sz + 'px';
    d.style.left = (dx - sz / 2) + 'px';
    d.style.top = (dy - sz / 2) + 'px';
    el.appendChild(d);
    setTimeout(function() { if (d.parentNode) d.parentNode.removeChild(d); }, 600);
  }

  function formatDate(ts) {
    if (!ts) return '';
    var d = new Date(ts);
    return d.getFullYear() + '/' + String(d.getMonth()+1).padStart(2,'0') + '/' + String(d.getDate()).padStart(2,'0');
  }

  // 截止日期徽标：返回 { text, cls }；逾期/今天 有高亮
  function dueInfo(dueStr) {
    if (!dueStr) return null;
    var today = new Date(); today.setHours(0,0,0,0);
    var due = new Date(dueStr + 'T00:00:00');
    if (isNaN(due.getTime())) return null;
    var diff = Math.round((due - today) / 86400000);
    if (diff < 0) return { text: '逾期 ' + Math.abs(diff) + ' 天', cls: 'due-overdue' };
    if (diff === 0) return { text: '今天截止', cls: 'due-today' };
    if (diff === 1) return { text: '明天截止', cls: 'due-today' };
    return { text: dueStr.slice(5).replace('-', '/') + ' 截止', cls: '' };
  }

  function parseSubtaskText(raw) {
    return String(raw || '').split(/\n|;|；|、/).map(function(x) { return x.trim(); }).filter(Boolean).slice(0, 20).map(function(text) { return { id: uid(), text: text, done: false }; });

  function render() {
    var list = getFiltered();
    var container = document.getElementById('todoList');
    if (!list.length) {
      var isEmpty = todos.length === 0;
      var svgInner = ipSvg('e');
      var stageMascot = !isEmpty ? ' ip-mascot--wave' : ' ip-mascot--surprised';
      var greetLine = isEmpty ? '✨ 你好呀，我是屿咪！' : '🎉 暂时没找到，试试别的筛选？';
      var subLine = isEmpty ? '还没有待办事项，添加一个吧 ✨' : '这个筛选下没有待办 🎉';
      var hintLine = isEmpty ? '按 <span class="kbd">/</span> 快速聚焦输入' : '点左上角筛选切换试试';
      container.innerHTML =
        '<div class="empty-state">' +
          '<div class="ip-stage">' +
            '<div class="ip-sparkles" aria-hidden="true">' +
              '<span class="ip-sparkle"></span><span class="ip-sparkle"></span>' +
              '<span class="ip-sparkle"></span><span class="ip-sparkle"></span>' +
              '<span class="ip-sparkle"></span><span class="ip-sparkle"></span>' +
            '</div>' +
            '<div class="ip-mascot ip-mascot--large ip-mascot--blink' + stageMascot + '" id="emptyMascot" title="屿咪 · 数字岛屿领航员">' + svgInner + '</div>' +
            '<span class="ip-stage-label">' + greetLine + '</span>' +
          '</div>' +
          '<p>' + subLine + '</p>' +
          '<p style="font-size:12px;color:var(--faint);margin-top:6px;font-weight:600">' + hintLine + '</p>' +
          '<div class="empty-actions">' +
            (isEmpty ? '<button class="empty-cta primary" data-empty="focus-input" type="button">添加第一个待办</button>' : '') +
            (isEmpty ? '<button class="empty-cta" data-empty="focus-tag" type="button">为待办加标签</button>' : '') +
          '</div>' +
        '</div>';
      initMascotSvg();
      var focusBtn = container.querySelector('[data-empty="focus-input"]');
      if (focusBtn) {
        focusBtn.addEventListener('click', function() {
          var inp = document.getElementById('todoInput');
          if (inp) inp.focus();
        });
      }
      var tagBtn = container.querySelector('[data-empty="focus-tag"]');
      if (tagBtn) {
        tagBtn.addEventListener('click', function() {
          var inp = document.getElementById('todoTag');
          if (inp) inp.focus();
        });
      }
      return;
    }

    var priorityOrder = { high: 0, mid: 1, low: 2 };
    var sorted = list.slice().sort(function(a, b) {
      if (a.done !== b.done) return a.done ? 1 : -1;
      // 未完成的：有截止日期的优先（按日期升序，越近越靠前）
      var da = a.done ? 0 : (a.due ? new Date(a.due + 'T00:00:00').getTime() : Infinity);
      var db = b.done ? 0 : (b.due ? new Date(b.due + 'T00:00:00').getTime() : Infinity);
      if (!a.done && !b.done && da !== db) return da - db;
      var pa = priorityOrder[a.priority];
      var pb = priorityOrder[b.priority];
      if (pa !== pb) return pa - pb;
      return (b.createdAt || 0) - (a.createdAt || 0);
    });

    var html = '';
    for (var i = 0; i < sorted.length; i++) {
      var todo = sorted[i];
      var prioText = todo.priority === 'high' ? '高' : todo.priority === 'low' ? '低' : '中';
      var date = formatDate(todo.createdAt);
      var doneCls = todo.done ? ' completed' : '';
      var due = dueInfo(todo.due);
      var dueOverdueCls = (due && due.cls === 'due-overdue' && !todo.done) ? ' due-overdue-item' : '';
      html += '<div class="todo-item' + doneCls + dueOverdueCls + ' prio-' + escapeHtml(todo.priority) + '" data-id="' + escapeHtml(todo.id) + '" tabindex="0" role="listitem">' +

          (todo.done ? '<span aria-hidden="true">✓</span>' : '') +
        '</div>' +
        '<div class="todo-body">' +
          (editingId === todo.id
            ? '<div class="edit-form">' +

            : '<div class="todo-title">' + escapeHtml(todo.title) + '</div>' +

                '<span class="priority-badge priority-' + escapeHtml(todo.priority) + '">' + prioText + '优先级</span>' +
                (due ? '<span class="due-badge ' + due.cls + '">' + due.text + '</span>' : '') +
                (todo.repeat ? '<span class="repeat-badge" data-repeat="' + escapeHtml(todo.repeat) + '" title="重复：' + escapeHtml(repeatLabel(todo.repeat)) + '">🔁 ' + escapeHtml(repeatLabel(todo.repeat)) + '</span>' : '') +
                ((todo.subtasks && todo.subtasks.length) ? subtasksBadgeHtml(todo) : '') +
                (todo.tag ? '<span class="tag-badge">' + escapeHtml(todo.tag) + '</span>' : '') +

  function isoDate(d) {
    return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
  }

  // 自然语言解析：!1/!2/!3 优先级、#标签/@标签、今天/明天/后天/下周一/M月D日
  function parseNaturalInput(raw) {
    var out = { title: raw, priority: null, tag: null, due: null };
    var title = raw;
    var today = new Date(); today.setHours(0, 0, 0, 0);
    function rel(days) {
      var d = new Date(today.getTime()); d.setDate(d.getDate() + days);
      return isoDate(d);
    }

    var m = title.match(/!([123])/);
    if (m) {
      out.priority = { '1': 'high', '2': 'mid', '3': 'low' }[m[1]];
      title = title.replace(/!([123])/, '');
    } else {
      m = title.match(/!(高|中|低)/);
      if (m) {
        out.priority = m[1] === '高' ? 'high' : (m[1] === '中' ? 'mid' : 'low');
        title = title.replace(/!(高|中|低)/, '');
      }
    }

    var dm = title.match(/大后天|后天|明天|今天/);
    if (dm) {
      out.due = rel({ '今天': 0, '明天': 1, '后天': 2, '大后天': 3 }[dm[0]]);
      title = title.replace(dm[0], '');
    } else {
      dm = title.match(/(下)?(周|星期|礼拜)(一|二|三|四|五|六|日|天)/);
      if (dm) {
        var wdMap = { '一': 1, '二': 2, '三': 3, '四': 4, '五': 5, '六': 6, '日': 0, '天': 0 };
        var diff = (wdMap[dm[3]] - today.getDay() + 7) % 7;
        if (dm[1] === '下') diff += 7;
        out.due = rel(diff);
        title = title.replace(dm[0], '');
      } else {
        dm = title.match(/(\d{4})-(\d{1,2})-(\d{1,2})/);
        if (dm) {
          out.due = dm[1] + '-' + String(dm[2]).padStart(2, '0') + '-' + String(dm[3]).padStart(2, '0');
          title = title.replace(dm[0], '');
        } else {
          dm = title.match(/(\d{1,2})月(\d{1,2})日/);
          if (dm) {
            var d = new Date(today.getFullYear(), +dm[1] - 1, +dm[2]);
            if (d < today) d = new Date(today.getFullYear() + 1, +dm[1] - 1, +dm[2]);
            out.due = isoDate(d);
            title = title.replace(dm[0], '');
          }
        }
      }
    }

    var tm = title.match(/([#@])([\u4e00-\u9fa5A-Za-z0-9_-]{1,20})/);
    if (tm) {
      out.tag = tm[2];
      title = title.replace(tm[0], '');
    }

    out.title = title.replace(/^[,，、；;:：\s]+/, '').replace(/[\s,，、]+$/, '').trim();
    return out;
  }

  function addTodo() {
    var titleEl = document.getElementById('todoInput');
    var tagEl = document.getElementById('todoTag');
    var prioEl = document.getElementById('todoPriority');
    var dueEl = document.getElementById('todoDue');
    var raw = titleEl.value.trim();
    if (!raw) {
      titleEl.focus();
      shakeForm();
      return;
    }
    var p = parseNaturalInput(raw);
    var repeatEl = document.getElementById('todoRepeat');
    todos.unshift({
      id: uid(),
      title: p.title || raw,
      tag: p.tag || tagEl.value.trim() || null,
      priority: p.priority || prioEl.value || 'mid',
      due: p.due || (dueEl && dueEl.value) || null,
      repeat: (repeatEl && repeatEl.value) || null,
      done: false,
      subtasks: [],
      createdAt: Date.now()
    });
    save();
    titleEl.value = '';
    tagEl.value = '';
    if (dueEl) dueEl.value = '';
    prioEl.value = 'mid';
    if (repeatEl) repeatEl.value = '';
    titleEl.focus();
    render();
    updateStats();
    renderTags();
    if (trash) purgeTrash();
    if (p.due || p.priority || p.tag) addSuccessFlash('✨ 已识别「' + (p.due || '') + (p.priority ? ' · ' + ({ high: '高', mid: '中', low: '低' })[p.priority] : '') + (p.tag ? ' · #' + p.tag : '') + '」');
    else addSuccessFlash('✨ 待办已添加');
  }

  function toggleTodo(id, x, y) {
    var todo = todos.find(function(t) { return t.id === id; });
    if (todo) {
      var wasDone = todo.done;
      todo.done = !todo.done;
      todo.completedAt = todo.done ? Date.now() : null;
      if (todo.done && todo.repeat) {
        todos.unshift({
          id: uid(),
          title: todo.title,
          tag: todo.tag,
          priority: todo.priority,
          due: nextRepeatDue(todo.due, todo.repeat),
          repeat: todo.repeat,
          done: false,
          subtasks: (todo.subtasks || []).map(function(s) { return { id: uid(), text: s.text, done: false }; }),
          createdAt: Date.now()
        });
      }
      save();
      render();
      updateStats();
      renderTags();
      scheduleReminders();
      if (!wasDone) { celebrateMascot(); if (x && y) confettiBurst(x, y); }
    }
  }

  function toggleSubtask(todoId, subtaskId) {
    var todo = todos.find(function(t) { return t.id === todoId; });
    if (!todo) return;
    if (!Array.isArray(todo.subtasks)) todo.subtasks = [];
    var sub = todo.subtasks.find(function(s) { return s.id === subtaskId; });
    if (!sub) return;
    sub.done = !sub.done;
    save();
    render();
    updateStats();

  function addSubtask(todoId) {
    var input = document.querySelector('.subtask-input[data-id="' + todoId + '"]');

    var todo = todos.find(function(t) { return t.id === todoId; });

    if (!Array.isArray(todo.subtasks)) todo.subtasks = [];

    render();

    var reader = new FileReader();
    reader.onload = function() {
      try {
        var data = JSON.parse(reader.result);
        var incoming = Array.isArray(data) ? data : (Array.isArray(data.todos) ? data.todos : null);
        if (!incoming) throw new Error('bad format');
        var merged = todos.slice();
        var seen = {};
        todos.forEach(function(t) { seen[t.id] = true; });
        incoming.forEach(function(t) {
          if (t && typeof t.id === 'string' && !seen[t.id]) { seen[t.id] = true; merged.push(t); }
        });
        if (!window.confirm('将合并导入 ' + incoming.length + ' 条待办（与现有 ' + todos.length + ' 条合并，按 ID 去重）。确定？')) return;

  function renderCalendar() {
    var container = document.getElementById('calendarView');
    if (!container) return;
    var y = calendarCursor.getFullYear();
    var m = calendarCursor.getMonth();
    var first = new Date(y, m, 1);
    var daysInMonth = new Date(y, m + 1, 0).getDate();
    var today = new Date(); today.setHours(0, 0, 0, 0);
    var byDate = {};
    todos.forEach(function(t) {
      if (!t.due) return;
      if (!byDate[t.due]) byDate[t.due] = [];
      byDate[t.due].push(t);
    });
    var html = '<div class="calendar"><div class="calendar-head">' +
      '<span class="calendar-title">' + y + ' 年 ' + (m + 1) + ' 月</span>' +
      '<div class="calendar-nav"><button type="button" data-cal="prev" aria-label="上个月">‹</button><button type="button" data-cal="today" aria-label="回到今天">今</button><button type="button" data-cal="next" aria-label="下个月">›</button></div>' +
      '</div><div class="calendar-grid"><div class="calendar-cell empty" aria-hidden="true"></div>';
    ['一','二','三','四','五','六','日'].forEach(function(d) { html += '<div class="calendar-cell empty" aria-hidden="true">' + '周' + d + '</div>'; });
    for (var i = 1; i <= daysInMonth; i++) {
      var d = new Date(y, m, i);
      var key = isoDate(d);
      var items = byDate[key] || [];
      var classes = 'calendar-cell' + (d.getDay() === 0 || d.getDay() === 6 ? ' weekend' : '') + (key === isoDate(today) ? ' today' : '');
      html += '<div class="' + classes + '" data-date="' + key + '"><div class="cal-date"><span>' + i + '</span><span class="cal-count">' + items.length + '</span></div><div class="cal-list">';
      items.slice(0, 3).forEach(function(t) {
        html += '<div class="cal-todo prio-' + escapeHtml(t.priority) + (t.done ? ' done' : '') + '" title="' + escapeHtml(t.title) + '">' + escapeHtml(t.title) + '</div>';
      });
      if (items.length > 3) html += '<div class="cal-more">+' + (items.length - 3) + ' 更多</div>';
      html += '</div></div>';
    }
    html += '</div></div>';
    container.innerHTML = html;
    container.querySelectorAll('[data-cal]').forEach(function(btn) {
      btn.addEventListener('click', function() {
        if (btn.dataset.cal === 'prev') calendarCursor.setMonth(calendarCursor.getMonth() - 1);
        if (btn.dataset.cal === 'next') calendarCursor.setMonth(calendarCursor.getMonth() + 1);
        if (btn.dataset.cal === 'today') calendarCursor = new Date();
        renderCalendar();
      });
    });
  }
  function reminderKey(t) { return t.id + '|' + (t.due || '') + '|' + (t.repeat || ''); }
  function reminderTitle(t) { return '屿事提醒：' + t.title + (t.repeat ? '（' + repeatLabel(t.repeat) + '）' : ''); }
  function reminderDue(t) { return t.due || isoDate(new Date()); }
  function reminderCandidate(t) {
    if (t.done || !t.due) return false;
    var due = new Date(t.due + 'T' + reminderAt + ':00');
    return Date.now() >= due.getTime() && Date.now() < due.getTime() + 3600000;
  }
  function addReminder(t) {
    if (!reminderEnabled || !reminderCandidate(t)) return;
    var key = reminderKey(t);
    if (reminders.some(function(r) { return r.key === key; })) return;
    reminders.push({ key: key, todoId: t.id, title: reminderTitle(t), due: reminderDue(t), createdAt: Date.now() });
    saveRemindersState();
    renderNotice();

  function renderNotice() {
    var panel = document.getElementById('noticePanel');
    var list = document.getElementById('noticeList');
    var clear = document.getElementById('noticeClear');
    if (!panel || !list) return;
    var pending = reminders.filter(function(r) { return r && r.key && !activeReminders[r.key]; });
    var html = pending.length
      ? pending.slice(0, 12).map(function(r) {
        return '<div class="notice-item"><span class="notice-dot"></span><div class="notice-body"><div class="notice-title-text">' + escapeHtml(r.title) + '</div><div class="notice-time">截止/周期：' + escapeHtml(r.due || '今天') + '</div></div><button class="notice-go" data-notice-key="' + escapeHtml(r.key) + '">知道了</button></div>';
      }).join('')
      : '<div class="notice-empty">暂无待提醒事项 🎉</div>';
    list.innerHTML = html;
    panel.classList.toggle('show', pending.length > 0);
    if (clear) clear.hidden = pending.length === 0;
    list.querySelectorAll('[data-notice-key]').forEach(function(btn) {
      btn.addEventListener('click', function() { activeReminders[btn.dataset.noticeKey] = true; renderNotice(); });
    });
  }
  function scheduleReminders() {
    todos.forEach(addReminder);
    renderNotice();
    if (reminderTimer) return;
    reminderTimer = setInterval(function() {
      todos.forEach(addReminder);
      renderNotice();
    }, 60000);
  }
  function requestBrowserReminder() {
    var btn = document.getElementById('browserRemindBtn');
    if (!btn) return;
    if (!('Notification' in window)) {
      window.alert('当前浏览器不支持桌面通知，已保留页面内提醒。');
      return;
    }
    if (Notification.permission === 'granted') {
      browserReminderOn = true;
      browserReminderPrompted = true;
      saveRemindersState();
      btn.classList.add('on');
      try { new Notification('屿事提醒已开启', { body: '到达提醒时间时会在这里提示。' }); } catch (e) {}
      return;
    }
    if (browserReminderOn && browserReminderPrompted) {
      window.alert('浏览器提醒权限之前已处理过；如想开启，请在浏览器站点设置中允许通知。页面内提醒仍可用。');
      return;
    }
    var p = Notification.requestPermission().then(function(permission) {
      browserReminderOn = permission === 'granted';
      browserReminderPrompted = true;
      saveRemindersState();
      btn.classList.toggle('on', browserReminderOn);
    });
    if (p && p.catch) p.catch(function() { browserReminderPrompted = true; saveRemindersState(); });
  }

  // 键盘：Enter 确认操作，Delete 删除（选中项）
  document.addEventListener('keydown', function(e) {
    if (e.key === 'Enter' && document.activeElement && document.activeElement.classList.contains('todo-item')) {
      var check = document.activeElement.querySelector('.todo-check');
      if (check) toggleTodo(check.dataset.id);
    } else if (e.key === 'Delete' || e.key === 'Backspace') {
      if (document.activeElement && document.activeElement.classList.contains('todo-item')) {
        var del = document.activeElement.querySelector('.todo-del');
        if (del) {
          softDeleteTodo(del.dataset.id);
        }
      }
    }
  });

  // 全局 / 快捷键：聚焦输入框
  document.addEventListener('keydown', function(e) {
    var active = document.activeElement;
    if (e.key === 'Escape' && editingId) { cancelEdit(); return; }
    if (e.key === '/' && active && !['INPUT','TEXTAREA','SELECT'].includes(active.tagName)) {
      e.preventDefault();
      var inp = document.getElementById('todoInput');
      if (inp) inp.focus();
    }
    if (e.key === 'Escape' && trash) { hideUndo(); trash = null; clearTimeout(trashTimer); }
    if (e.key === 'Escape' && active === document.getElementById('todoInput')) {
      var inp2 = document.getElementById('todoInput');
      if (inp2) inp2.blur();
    }
  });

  load();
  loadRemindersState();
  initMascotSvg();
  render();
  updateStats();
  renderTags();
  switchView('list');
  scheduleReminders();
})();
</script>
</body>
</html>

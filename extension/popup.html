<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>保存到屿航</title>
  <style>
    :root { color-scheme: light; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; color: #17233d; background: #f5f7ff; }
    body { width: 330px; margin: 0; padding: 16px; box-sizing: border-box; }
    h1 { margin: 0 0 14px; font-size: 18px; }
    .field { margin: 0 0 12px; }
    label { display: block; margin-bottom: 5px; font-size: 12px; font-weight: 700; color: #52617b; }
    input, textarea { width: 100%; box-sizing: border-box; padding: 9px 10px; border: 1px solid #cbd4e7; border-radius: 9px; background: #fff; color: inherit; font: inherit; }
    textarea { min-height: 62px; resize: vertical; }
    input:focus, textarea:focus, button:focus-visible { outline: 3px solid #b8cbff; outline-offset: 2px; }
    .hint { margin: -5px 0 12px; font-size: 11px; line-height: 1.45; color: #65738c; }
    .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    button { min-height: 38px; padding: 8px 10px; border: 0; border-radius: 9px; cursor: pointer; color: #fff; background: #315fe8; font: inherit; font-weight: 700; }
    button.secondary { color: #24334f; background: #e6ebf7; }
    button.wide { grid-column: 1 / -1; }
    button:disabled { cursor: wait; opacity: .65; }
    #status { min-height: 18px; margin: 12px 0 0; font-size: 12px; line-height: 1.45; color: #52617b; }
    #status.error { color: #b42318; }
    #status.success { color: #087443; }
  </style>
</head>
<body>
  <h1>🏝️ 保存到屿航</h1>
  <form id="save-form" data-target="http://localhost:8000/index.html">
    <div class="field">
      <label for="title">标题</label>
      <input id="title" name="title" autocomplete="off" required>
    </div>
    <div class="field">
      <label for="url">网址</label>
      <textarea id="url" name="url" spellcheck="false" required></textarea>
    </div>
    <div class="field">
      <label for="target">屿航 Web URL</label>
      <input id="target" name="target" type="url" placeholder="https://example.com/index.html" required>
    </div>
    <p class="hint">保存会以查询参数打开屿航页面；不会读取浏览器书签，也不会修改现有站点数据。</p>
    <div class="actions">
      <button id="save" type="submit">保存到屿航</button>
      <button id="copy" class="secondary" type="button">复制 JSON</button>
      <button id="open" class="secondary wide" type="button">打开屿航链接</button>
    </div>
  </form>
  <p id="status" role="status" aria-live="polite"></p>
  <script src="popup.js"></script>
</body>
</html>
